name: Make Skopje budget static once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skopje-static-budget-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make budget static
        run: python scripts/make_skopje_budget_static.py
      - name: Commit and clean one-shot files
        run: |
          rm .github/workflows/skopje-static-budget-once.yml scripts/make_skopje_budget_static.py
          git config user.name "ChatGPT Update"
          git config user.email "actions@users.noreply.github.com"
          git add october/index.html .github/workflows/skopje-static-budget-once.yml scripts/make_skopje_budget_static.py
          git diff --cached --check
          git commit -m "Make Skopje budget managed from chat"
          git push origin main
