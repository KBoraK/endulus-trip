name: Update Skopje airport bus plan once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skopje-update-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Skopje update
        run: python scripts/update_skopje_bus.py
      - name: Commit updated page and remove one-shot files
        run: |
          rm .github/workflows/skopje-update-once.yml scripts/update_skopje_bus.py
          git config user.name "ChatGPT Update"
          git config user.email "actions@users.noreply.github.com"
          git add october/index.html .github/workflows/skopje-update-once.yml scripts/update_skopje_bus.py
          git diff --cached --check
          git commit -m "Update Skopje return flight and airport bus plan"
          git push origin main
