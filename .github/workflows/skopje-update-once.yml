name: Update Skopje airport bus plan once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skopje-update-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update October Skopje page
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('october/index.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected text: {label}')
              s = s.replace(old, new, 1)

          rep('<div class="stat"><b>2,5</b><small>gezi günü</small></div>',
              '<div class="stat"><b>3</b><small>gezi günü</small></div>', 'trip day stat')
          rep('<button data-v="transport">🚕 Ulaşım</button>',
              '<button data-v="transport">🚌 Ulaşım</button>', 'transport tab icon')
          rep('<div class="small">06:45–09:05</div>',
              '<div class="small">17:50–20:10</div>', 'return flight time')
          rep('<div class="warn"><b>Konaklama merkezi:</b> Tüm günlük rotalar artık <b>Airbnb · Miroslav Krleza 20, 1000 Skopje</b> başlangıç/bitiş noktası olarak planlandı. Airbnb check-in <b>30 Ekim 14:00</b>, check-out <b>2 Kasım 11:00</b>. 2 Kasım 06:45 uçuşu nedeniyle fiilî çıkış yaklaşık 03:45; bu saatte ana plan doğrudan taksi.</div>',
              '<div class="warn"><b>Konaklama merkezi:</b> Tüm günlük rotalar <b>Airbnb · Miroslav Krleza 20, 1000 Skopje</b> başlangıç/bitiş noktası olarak planlandı. Airbnb check-in <b>30 Ekim 14:00</b>, check-out <b>2 Kasım 11:00</b>. Dönüş uçuşu artık <b>2 Kasım 17:50–20:10</b>. Havalimanı transferinde ana plan taksi değil <b>V2V / WTransporter airport shuttle</b>: gelişte 16:30 hedef (kaçarsa 17:45), dönüşte Holiday Inn durağından 15:20.</div>', 'home warning')

          day30 = '''<details class="day" open>
  <summary><div><h3>30 Ekim · Cuma · Varış + Old Bazaar</h3><div class="date">SKP → V2V airport shuttle → Holiday Inn → Airbnb (Miroslav Krleza 20) → Old Bazaar</div></div><b>⌄</b></summary>
  <div class="timeline">
   <div class="item"><div class="time">15:50</div><div><div class="name">✈️ Skopje varış</div><div class="desc">Pasaport ve bagaj sonrası airport shuttle durağına geç.</div><span class="tag">FIX</span></div></div>
   <div class="item"><div class="time">16:30</div><div><div class="name">🚌 V2V / WTransporter → Holiday Inn</div><div class="desc">Cuma tarifesinde ilk hedef 16:30 airport → Skopje shuttle. Pasaport/bagaj uzarsa sonraki uygun sefer 17:45. Tek yön 199 MKD/kişi; bilet otobüste kart veya nakitle alınabiliyor.</div><a class="maplink" target="_blank" href="https://www.wtransporter.com/">→ Güncel shuttle tarifesi</a></div></div>
   <div class="item"><div class="time">~17:10</div><div><div class="name">🚶 Holiday Inn → Airbnb · Miroslav Krleza 20</div><div class="desc">Holiday Inn durağından Airbnb'ye yaklaşık 20–25 dk yürüyüş. 17:45 shuttle'a kalınırsa sonraki aktiviteleri yaklaşık 1 saat ileri kaydır.</div><a class="maplink" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=Holiday+Inn+Skopje&destination=Miroslav+Krleza+20+Skopje&travelmode=walking">→ Airbnb'ye yürü</a></div></div>
   <div class="item"><div class="time">~17:35</div><div><div class="name">🏠 Airbnb · Miroslav Krleza 20 · check-in</div><div class="desc">Check-in 14:00'ten itibaren. Kısa dinlenme ve ardından merkeze yürüyüş.</div><a class="maplink" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Miroslav+Krleza+20+Skopje">⌖ Airbnb adresi</a></div></div>
   <div class="item"><div class="time">18:15</div><div><div class="name">🚶 Airbnb → Macedonia Square → Stone Bridge</div><div class="desc">Miroslav Krleza 20'den merkeze yürüyüş; Macedonia Square ardından Stone Bridge üzerinden Old Bazaar'a devam.</div><a class="maplink" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=Miroslav+Krleza+20+Skopje&destination=Stone+Bridge+Skopje&waypoints=Macedonia+Square+Skopje&travelmode=walking">→ Yürüyüş rotası</a></div></div>
   <div class="item"><div class="time">19:00</div><div><div class="name">Old Bazaar akşam yürüyüşü</div><div class="desc">Stone Bridge'den karşıya geçip Osmanlı çarşısına, hanlara ve ara sokaklara devam.</div><a class="maplink" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=Stone+Bridge+Skopje&destination=Old+Bazaar+Skopje&travelmode=walking">→ Çarşıya yürü</a></div></div>
   <div class="item"><div class="time">20:00</div><div><div class="name">🍴 Destan / Old Bazaar</div><div class="desc">Kebapi + shopska salatası. Yemekten sonra aynı merkez aksından Airbnb'ye yürüyerek dön.</div><a class="maplink" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=Destan+Skopje&destination=Miroslav+Krleza+20+Skopje&travelmode=walking">→ Airbnb'ye dönüş</a></div></div>
  </div>
 </details>'''
          s, n = re.subn(r'<details class="day" open>\s*<summary><div><h3>30 Ekim · Cuma · Varış \+ Old Bazaar</h3>.*?</details>', day30, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace 30 October plan')

          rep('Sabah erken uçuş için valizi hazırla; shuttle/taksi kararını gece netleştir.',
              'Valizi toparla; yarın 11:00 check-out sonrası valizleri mümkünse ev sahibine bırakıp son şehir turunu yap.', '1 November luggage note')

          day2 = '''<details class="day">
  <summary><div><h3>2 Kasım · Pazartesi · Son gezi + dönüş</h3><div class="date">Airbnb → City Park → merkez / Old Bazaar → Holiday Inn → V2V shuttle → SKP</div></div><b>⌄</b></summary>
  <div class="timeline">
   <div class="item"><div class="time">08:30</div><div><div class="name">☕ Kahvaltı + City Park</div><div class="desc">Son sabahı acele etmeden geçir; Debar Maalo / City Park çevresinde kahvaltı ve kısa yürüyüş.</div><a class="maplink" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=Miroslav+Krleza+20+Skopje&destination=City+Park+Skopje&travelmode=walking">→ City Park rotası</a></div></div>
   <div class="item"><div class="time">10:30</div><div><div class="name">🏠 Airbnb'ye dönüş + hazırlık</div><div class="desc">Valizleri kapat ve check-out için hazırlan.</div></div></div>
   <div class="item"><div class="time">11:00</div><div><div class="name">Check-out + valizleri bırak</div><div class="desc">Mümkünse ev sahibinden valizleri yaklaşık 14:00'e kadar bırakmak için önceden izin iste.</div><span class="tag">Ev sahibine sor</span></div></div>
   <div class="item"><div class="time">11:15–13:45</div><div><div class="name">🚶 Son şehir turu / öğle yemeği</div><div class="desc">Macedonia Square, merkez veya Old Bazaar'da son alışveriş ve rahat öğle yemeği.</div><a class="maplink" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=Miroslav+Krleza+20+Skopje&destination=Old+Bazaar+Skopje&waypoints=Macedonia+Square+Skopje&travelmode=walking">→ Son şehir yürüyüşü</a></div></div>
   <div class="item"><div class="time">14:00</div><div><div class="name">🧳 Valizleri al</div><div class="desc">Airbnb'den valizleri alıp airport shuttle durağına geç.</div></div></div>
   <div class="item"><div class="time">14:30</div><div><div class="name">🚶 Airbnb → Holiday Inn shuttle durağı</div><div class="desc">Valizle rahat tempo için yaklaşık 30 dk tampon bırak. Hedef: 15:00 civarında durakta olmak.</div><a class="maplink" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=Miroslav+Krleza+20+Skopje&destination=Holiday+Inn+Skopje&travelmode=walking">→ Holiday Inn durağına yürü</a></div></div>
   <div class="item"><div class="time">15:20</div><div><div class="name">🚌 V2V / WTransporter · Holiday Inn → SKP</div><div class="desc">Pazartesi tarifesindeki 15:20 şehir → havalimanı seferi. Tek yön 199 MKD/kişi. Tarifeyi seyahate yakın tekrar kontrol et; seferler uçuş programına göre güncellenebiliyor.</div><a class="maplink" target="_blank" href="https://www.wtransporter.com/">→ Güncel shuttle tarifesi</a></div></div>
   <div class="item"><div class="time">~16:00</div><div><div class="name">🛫 Skopje Havalimanı</div><div class="desc">17:50 uluslararası uçuş için yaklaşık 1 saat 50 dk tampon. Check-in kontuarları normalde kalkıştan 120 dk önce açılır ve en geç 40 dk önce kapanır.</div></div></div>
   <div class="item"><div class="time">17:50</div><div><div class="name">✈️ Skopje → Basel</div><div class="desc">20:10 Basel varış.</div><span class="tag">FIX</span></div></div>
  </div>
 </details>'''
          s, n = re.subn(r'<details class="day">\s*<summary><div><h3>2 Kasım · Pazartesi · Dönüş</h3>.*?</details>', day2, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace 2 November plan')

          rep('<div class="meta"><b>🚌 Holiday Inn airport shuttle:</b> önceki konaklamaya göre daha uzak; 06:45 uçuşunda doğrudan taksi daha pratik.</div>',
              '<div class="meta"><b>🚌 Holiday Inn airport shuttle:</b> 2 Kasım dönüşte hedef 15:20 V2V/WTransporter seferi; Airbnb’den durağa valizle yaklaşık 20–30 dk yürüyüş planla.</div>', 'booked stay shuttle note')
          rep('<div class="meta">− Çok erken dönüşte shuttle durağına ekstra yürüyüş gerektiriyor.</div>',
              '<div class="good">✓ 17:50 dönüş uçuşu sayesinde 2 Kasım sabahı City Park + merkez için zaman var.</div>', 'booked stay early return note')
          rep('<a class="action" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=Miroslav+Krleza+20+Skopje&destination=Skopje+International+Airport&travelmode=driving">🚕 Airport rota</a>',
              '<a class="action" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=Miroslav+Krleza+20+Skopje&destination=Holiday+Inn+Skopje&travelmode=walking">🚌 Shuttle durağı</a>', 'booked stay airport action')

          transport = '''<section id="transport" class="view">
 <div class="head"><div><div class="ey">OTOBÜS + YÜRÜYÜŞ</div><h2>Ulaşım</h2></div></div>
 <div class="transportgrid">
  <article class="transport"><div class="ey">30 EKİM · SKP → MERKEZ</div><h3>V2V / WTransporter Airport Shuttle</h3><div class="meta">Resmî airport shuttle. Tek yön <b>199 MKD/kişi</b>. Cuma günü 15:50 inişten sonra <b>16:30</b> seferini hedefle; pasaport/bagaj nedeniyle kaçarsa <b>17:45</b> sonraki uygun sefer. Holiday Inn durağında inip Airbnb’ye yürüyün.</div><div class="actions"><a class="action primary" target="_blank" href="https://www.wtransporter.com/">Güncel tarife ↗</a><a class="action" target="_blank" href="https://skp.airports.com.mk/en-EN/to-from-the-airport">Havalimanı resmî bilgi ↗</a></div></article>
  <article class="transport"><div class="ey">2 KASIM · MERKEZ → SKP</div><h3>15:20 Airport Shuttle</h3><div class="meta"><b>17:50 Skopje → Basel</b> uçuşu için ana plan: Airbnb’den 14:30 civarı yürüyerek Holiday Inn durağına geç, 15:00 civarı durakta ol ve <b>15:20</b> V2V/WTransporter otobüsüne bin. Tahmini havalimanı varışı ~16:00.</div><div class="actions"><a class="action primary" target="_blank" href="https://www.wtransporter.com/">Güncel tarife ↗</a><a class="action" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=Miroslav+Krleza+20+Skopje&destination=Holiday+Inn+Skopje&travelmode=walking">→ Holiday Inn durağı</a></div></article>
  <article class="transport"><div class="ey">ŞEHİR İÇİ</div><h3>Yürüyüş + toplu taşıma</h3><div class="meta">Macedonia Square, Stone Bridge, Old Bazaar ve Kale birbirine yakın; merkez gününü büyük ölçüde yürüyerek yap. Vodno ve Matka için mümkün olduğunca otobüs / toplu taşıma kullan.</div></article>
 </div>
 <div class="warn"><b>Tarife notu:</b> Airport shuttle saatleri uçuş programına göre güncellenebiliyor. Özellikle 30 Ekim 16:30/17:45 ve 2 Kasım 15:20 seferlerini seyahate yakın WTransporter sitesinden tekrar kontrol et.</div>
</section>'''
          s, n = re.subn(r'<section id="transport" class="view">.*?</section>', transport, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace transport section')

          rep('placeholder="airport transfer, Matka taxi, şehir içi taxi..."',
              'placeholder="airport shuttle, Matka otobüs, şehir içi toplu taşıma..."', 'transport budget placeholder')

          p.write_text(s, encoding='utf-8')
      - name: Commit updated page and remove one-shot workflow
        run: |
          rm .github/workflows/skopje-update-once.yml
          git config user.name "ChatGPT Update"
          git config user.email "actions@users.noreply.github.com"
          git add october/index.html .github/workflows/skopje-update-once.yml
          git diff --cached --check
          git commit -m "Update Skopje return flight and airport bus plan"
          git push origin main
