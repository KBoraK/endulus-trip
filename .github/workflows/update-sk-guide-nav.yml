name: Update Skopje guide navigation
on:
  push:
    branches: [main]
    paths:
      - scripts/persist_guide_nav.py
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/persist_guide_nav.py
      - run: |
          git config user.name "ChatGPT Update"
          git config user.email "actions@users.noreply.github.com"
          git add october/index.html october/guide.html
          git commit -m "Keep Skopje navigation visible in guide" || exit 0
          git push
