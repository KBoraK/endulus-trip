name: Update Skopje new Airbnb once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-skopje-new-airbnb-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply new Airbnb details
        run: python scripts/update_skopje_new_airbnb.py
      - name: Commit and clean one-shot files
        run: |
          rm .github/workflows/update-skopje-new-airbnb-once.yml scripts/update_skopje_new_airbnb.py
          git config user.name "ChatGPT Update"
          git config user.email "actions@users.noreply.github.com"
          git add october/index.html october/guide.html .github/workflows/update-skopje-new-airbnb-once.yml scripts/update_skopje_new_airbnb.py
          git diff --cached --check
          git commit -m "Update Skopje Airbnb and booked budget"
          git push origin main
