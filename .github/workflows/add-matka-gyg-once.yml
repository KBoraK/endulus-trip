name: Add Matka GetYourGuide links once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-matka-gyg-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Matka GetYourGuide links
        run: python scripts/add_matka_gyg_links.py
      - name: Commit updated page and remove one-shot files
        run: |
          rm .github/workflows/add-matka-gyg-once.yml scripts/add_matka_gyg_links.py
          git config user.name "ChatGPT Update"
          git config user.email "actions@users.noreply.github.com"
          git add october/index.html .github/workflows/add-matka-gyg-once.yml scripts/add_matka_gyg_links.py
          git diff --cached --check
          git commit -m "Add reliable Matka GetYourGuide options"
          git push origin main
