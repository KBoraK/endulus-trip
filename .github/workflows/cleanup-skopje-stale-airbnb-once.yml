name: Cleanup Skopje stale lodging text once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-skopje-stale-airbnb-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cleanup stale lodging info
        run: python scripts/cleanup_skopje_stale_airbnb.py
      - name: Commit and cleanup one-shot files
        run: |
          rm .github/workflows/cleanup-skopje-stale-airbnb-once.yml scripts/cleanup_skopje_stale_airbnb.py
          git config user.name "ChatGPT Update"
          git config user.email "actions@users.noreply.github.com"
          git add october/index.html .github/workflows/cleanup-skopje-stale-airbnb-once.yml scripts/cleanup_skopje_stale_airbnb.py
          git diff --cached --check
          git commit -m "Clean stale Skopje lodging and flight text"
          git push origin main
