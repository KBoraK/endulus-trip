name: Cleanup old Skopje return references once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-skopje-old-return-refs-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cleanup old return references
        run: python scripts/cleanup_skopje_old_return_refs.py
      - name: Commit and cleanup one-shot files
        run: |
          rm .github/workflows/cleanup-skopje-old-return-refs-once.yml scripts/cleanup_skopje_old_return_refs.py
          git config user.name "ChatGPT Update"
          git config user.email "actions@users.noreply.github.com"
          git add october/index.html .github/workflows/cleanup-skopje-old-return-refs-once.yml scripts/cleanup_skopje_old_return_refs.py
          git diff --cached --check
          git commit -m "Clean remaining old Skopje return references"
          git push origin main
