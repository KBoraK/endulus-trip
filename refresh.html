<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee8dc">
<title>Endülüs · Güncelleme</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eee8dc;color:#293027;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:520px;padding:28px;text-align:center}
h1{font:700 34px/1 Georgia,serif;margin:0 0 14px}
p{line-height:1.55;color:#746f65}.dot{font-size:36px;margin-bottom:18px}
</style>
</head>
<body><main><div class="dot">↻</div><h1>Roadbook güncelleniyor</h1><p id="msg">Eski Android/PWA önbelleği temizleniyor. Rezervasyon ve notların korunacak.</p></main>
<script>
(async()=>{
 const msg=document.getElementById("msg");
 try{
  const base=new URL("./",location.href).href;
  if("serviceWorker" in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.filter(r=>r.scope===base||r.scope.startsWith(base)).map(r=>r.unregister()));
  }
  if("caches" in window){
   const keys=await caches.keys();
   await Promise.all(keys.filter(k=>k.startsWith("endulus-")).map(k=>caches.delete(k)));
  }
  const target=new URL("./",location.href);
  target.searchParams.set("build","6.2.22");
  target.searchParams.set("repaired","1");
  setTimeout(()=>location.replace(target.href),250);
 }catch(e){
  msg.textContent="Otomatik temizlik tamamlanamadı. Sayfayı yeniden açmayı dene.";
 }
})();
</script></body></html>
